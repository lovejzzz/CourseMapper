name: Nightly main quality evaluation

# The complete 40-fixture quality ruler is intentionally separate from Fast
# verification. It runs every night and on demand without making routine
# commits, production deployment, or the commit status indicator wait about 17
# extra minutes.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-main-quality-evaluation
  cancel-in-progress: true

jobs:
  evaluate:
    name: Main quality evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the complete evaluation ruler
        run: npm run audit:evaluation:main

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-quality-evaluation-reports
          path: verification-output/evaluation-system/**
          if-no-files-found: ignore
