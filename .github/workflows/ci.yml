name: Fast verification
on:
  pull_request:
  push:
    branches: [main, codex/course-studio-rebuild, codex/v0187-quality]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    name: Application source, compatibility and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: production-browser-evidence
          path: test-results/**
          if-no-files-found: ignore
  browser:
    name: Classroom editing and exports in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: application-browser-evidence
          path: |
            test-results/**
            verification-output/compatibility-browser/**
          if-no-files-found: ignore
  adapter-mask:
    name: Experimental adapter training regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install 'numpy>=2,<3'
      - run: python3 research/scion/test_completion_target_mask.py
  verify-fast:
    name: Fast verification
    runs-on: ubuntu-latest
    if: always()
    needs: [studio, browser, adapter-mask]
    steps:
      - name: Require all release checks
        env:
          STUDIO_RESULT: ${{ needs.studio.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          ADAPTER_RESULT: ${{ needs.adapter-mask.result }}
        run: |
          test "$STUDIO_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$ADAPTER_RESULT" = success
