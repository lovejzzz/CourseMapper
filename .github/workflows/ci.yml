name: Fast verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Release history audit
        run: npm run audit:release-history

      - name: Unit and closed-loop tests
        run: npm test

      - name: Proof smoke
        run: |
          npm run test:blueprint:quality:fast
          npm run audit:deliverables
          npm run audit:pipeline

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run bundle:check
