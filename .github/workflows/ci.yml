name: Fast verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-build:
    name: Static, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Release and evidence receipts
        run: |
          npm run audit:release-history
          npm run audit:scion:codex-cross-revision-evidence
          npm run audit:scion:source-compiler-replay
          npm run audit:scion:semantic-expansion-evidence:v0.16.61
          npm run audit:scion:review-candidates
          npm run audit:scion:source-review-packet
          npm run audit:scion:codex-first-order
          npm run audit:scion:codex-first-order-evidence
          npm run audit:scion:codex-reverse-order
          npm run audit:scion:codex-paired-order-evidence
          npm run audit:scion:adapter:corpus-readiness
          npm run audit:scion:adapter:exact-lineage
          npm run audit:texture:cross-package -- --profile thin --verify-baseline
          npm run audit:texture:cross-package -- --profile gold --verify-baseline

      - name: Proof smoke
        run: |
          npm run test:blueprint:quality:fast
          npm run audit:deliverables
          npm run audit:pipeline

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run bundle:check

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-smoke-reports
          path: |
            verification-output/contract-quality-audit/**
            verification-output/gold-sample-quality-audit/latest.*
            verification-output/independent-benchmark/**
            verification-output/production-canary/**
            verification-output/cross-package-texture/**
          if-no-files-found: ignore

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit shard
        run: npm test -- --shard=${{ matrix.shard }}/2

  contract-evaluation:
    name: Contract evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run bounded evaluation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npm run audit:evaluation:pr -- --changed-from "${{ github.event.pull_request.base.sha }}"
          else
            npm run audit:evaluation:pr
          fi

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-contract-evaluation-reports
          path: verification-output/evaluation-system/**
          if-no-files-found: ignore

  verify-fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - static-build
      - unit
      - contract-evaluation

    steps:
      - name: Require every fast lane
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.static-build.result }}" == "success" ]]
          [[ "${{ needs.unit.result }}" == "success" ]]
          [[ "${{ needs.contract-evaluation.result }}" == "success" ]]
