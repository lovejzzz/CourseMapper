name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
      - 'codex/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit and closed-loop tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run bundle:check

  verify-deep:
    name: Deep proof gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Deliverable quality audit
        run: npm run audit:deliverables

      - name: Hybrid pipeline audit
        run: npm run audit:pipeline

      - name: Gold sample quality audit
        run: npm run audit:gold

      - name: Internal expert-style audit
        run: npm run audit:expert

      - name: Optional proof packet build
        run: npm run audit:expert:packet

      - name: E2E tests
        run: npm run test:e2e

      - name: Firebase rules tests
        run: npm run test:rules
