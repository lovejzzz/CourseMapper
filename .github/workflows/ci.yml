name: Fast verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Release history audit
        run: |
          npm run audit:release-history
          npm run audit:scion:codex-cross-revision-evidence
          npm run audit:scion:source-compiler-replay
          npm run audit:scion:review-candidates
          npm run audit:scion:source-review-packet
          npm run audit:scion:adapter:corpus-readiness
          npm run audit:scion:adapter:exact-lineage

      - name: Unit and closed-loop tests
        run: npm test

      - name: Proof smoke
        run: |
          npm run test:blueprint:quality:fast
          npm run audit:deliverables
          npm run audit:pipeline

      - name: Pull request evaluation
        if: github.event_name == 'pull_request'
        run: npm run audit:evaluation:pr -- --changed-from "${{ github.event.pull_request.base.sha }}"

      - name: Main evaluation
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run audit:evaluation:main

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run bundle:check

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layered-evaluation-reports
          path: |
            verification-output/contract-quality-audit/**
            verification-output/gold-sample-quality-audit/latest.*
            verification-output/independent-benchmark/**
            verification-output/production-canary/**
            verification-output/evaluation-system/**
          if-no-files-found: ignore
