name: Deep proof gates

# Deep proof is the heavy battery. It is NOT a per-commit gate on main: routine
# commits are covered by Fast verification. Deep proof runs on every release/**
# branch and on demand via workflow_dispatch.
#
# Policy:
# - App/runtime gates stay strict everywhere: broken build/export/download,
#   failing E2E, rules failures, or package-integrity failures should make the
#   workflow red.
# - Educational-quality gates are strict for workflow_dispatch and release/**
#   pushes.
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: deep-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-scope:
    name: Deep proof scope
    runs-on: ubuntu-latest
    outputs:
      run_deep: ${{ steps.scope.outputs.run_deep }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: scope
        name: Decide whether deep proof is needed
        shell: bash
        run: |
          set -euo pipefail

          run_deep=false
          reason="main push without deep-proof paths"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            run_deep=true
            reason="manual dispatch"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            run_deep=true
            reason="release branch"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi

            if [[ -z "$base" ]]; then
              run_deep=true
              reason="missing comparison base"
            else
              changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"
              echo "$changed_files"

              if echo "$changed_files" | grep -Eq '^((src/lib/|tests/|scripts/)|package(-lock)?\.json$|vite\.config\.|playwright\.config\.|firebase\.json$|firestore\.rules$|\.github/workflows/(ci|deep-proof|deploy)\.yml$)'; then
                run_deep=true
                reason="source, compiler, test, script, dependency, rules, or workflow change"
              fi
            fi
          fi

          echo "run_deep=$run_deep" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Deep proof decision: $run_deep ($reason)"

  verify-app:
    name: Deep proof app/runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: detect-scope
    if: needs.detect-scope.outputs.run_deep == 'true'

    steps:
      - name: Scope reason
        run: echo "${{ needs.detect-scope.outputs.reason }}"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Hybrid pipeline audit
        run: npm run audit:pipeline

      - name: E2E tests
        run: npm run test:e2e

      - name: Firebase rules tests
        run: npm run test:rules

      - name: Bundle budgets
        run: npm run bundle:check

      - name: Upload app proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-proof-app-reports
          path: |
            verification-output/hybrid-pipeline-audit/latest.*
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  quality-intelligence:
    name: Deep proof quality intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: detect-scope
    if: needs.detect-scope.outputs.run_deep == 'true'

    steps:
      - name: Scope reason
        run: echo "${{ needs.detect-scope.outputs.reason }}"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Educational quality gates
        env:
          DEEP_PROOF_QUALITY_MODE: strict
        run: npm run audit:deep-quality -- --mode "$DEEP_PROOF_QUALITY_MODE"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-proof-quality-reports
          path: |
            verification-output/deep-proof-quality-gate/**
            verification-output/gold-sample-quality-audit/latest.*
            verification-output/expert-review-quality-audit/latest.*
            verification-output/external-quality-proof-packet/latest.*
          if-no-files-found: ignore
